context:
  version: 2026.08.27
  distro: ubuntu-24.04

package:
  name: riscv-toolchain
  version: 0.0.0

source:
  url: https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/${{ version }}/riscv64-elf-${{ distro }}-llvm.tar.xz
  sha256: 6a6d6adbe09731d749469d6c0fc7daaf2363dce8ce7e7e6093370f59961153ca
  file_name: riscv.tar.xz

build:
  script:
    - mkdir -p "$PREFIX/opt/riscv64-unknown-elf" "$PREFIX/bin"
    - bsdtar --no-same-owner --preserve-permissions --strip-components=1 -xf riscv.tar.xz -C "$PREFIX/opt/riscv64-unknown-elf"
    # - |
    #   for file in "$PREFIX/opt/riscv64-unknown-elf/bin/riscv64-unknown-elf"*; do
    #     file="$(basename "$file")"
    #     ln -s "../opt/riscv64-unknown-elf/bin/$file" "$PREFIX/bin"
    #   done
  dynamic_linking:
    binary_relocation: false

requirements:
  build:
    - libarchive
  host:
    - libzlib >=1.3
    - zstd >=1.5
    - gmp >=6.3
    - mpc >=1.4
    - mpfr >=4.2
  run:
    # - __glibc >=2.39
    - libgcc >=16
    - libstdcxx >=16
