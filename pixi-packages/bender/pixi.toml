[package]
name = "bender"
version = "0.32.1"

[package.build]
backend = { name = "pixi-build-rust", version = ">=0.5,<0.6" }

[package.build.source]
git = "https://github.com/pulp-platform/bender.git"
rev = "v0.32.1"

[package.build.config]
compilers = ["rust", "cxx"]
extra-args = ["--no-default-features"]
