[workspace]
channels = ["conda-forge"]
name = "cheshire"
platforms = ["linux-64"]
version = "0.0.0"
preview = ["pixi-build"]

[tasks]

[tasks.build]
cmd = "make all"
env = {
    PATH = "$(pwd)/.pixi/envs/default/opt/riscv64-unknown-elf/bin:$PATH",
    LD_LIBRARY_PATH = "$(pwd)/.pixi/envs/default/lib",
}

[dependencies]
# sysroot_linux-64 = "==2.28"
bender = { path = "pixi-packages/bender" }
riscv-toolchain = { path = "pixi-packages/riscv-toolchain" }
python = ">=3.11"
make = "*"
wget = "*"
unzip = "*"
# FIXME: make conda package for gdisk (it's currently installed by apt in the base container)

[pypi-dependencies]
"requests" = "*"
"hjson" = "*"
"mako" = "*"
"pyyaml" = "*"
"tabulate" = "*"
"yapf" = "*"
"mkdocs" = "*"
"mkdocs-material" = "*"
"markdown-grid-tables" = "*"
"tclint" = "==0.4.2"
"flatdict" = ">=4.1.0"
"setuptools" = "<81" # Required by old `regtool`
"peakrdl" = ">=1.5.0"
"peakrdl-rawheader" = ">=0.2.3"

[workspace.build-variants]
c_compiler = ["clang"]
cxx_compiler = ["clangxx"]
